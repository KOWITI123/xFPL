id: fbref_ingest
namespace: xfpl

description: |
  Weekly FBref extraction pipeline (best-effort).
  Scrapes standard, goalkeeper, shooting, and miscellaneous stats via soccerdata.
  Rate-limited to avoid Cloudflare blocks.
  Flattens MultiIndex columns and writes clean CSVs with graceful fallbacks.

inputs:
  - id: season
    type: STRING
    defaults: "2026"

tasks:
  - id: scrape_fbref
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install soccerdata pandas
    outputFiles:
      - "*.csv"
    script: |
      import soccerdata as sd
      import pandas as pd
      import time
      from datetime import datetime

      season = "{{ inputs.season }}"
      today = datetime.now().strftime("%Y-%m-%d")

      # Verified valid player season stat categories supported by soccerdata
      stat_types = {
          "standard": "fbref_standard",   # goals, assists, minutes, cards
          "keeper": "fbref_keeper",       # saves, GA, clean sheets, save%, SoTA
          "shooting": "fbref_shooting",   # shots, shots on target, SoT%, conversion
          "misc": "fbref_misc",           # tackles won, interceptions, crosses, fouls
      }

      DELAY_SECONDS = 6

      print(f"Scraping FBref for EPL {season} (rate-limited, {DELAY_SECONDS}s between requests)...")

      try:
          fbref = sd.FBref(leagues="ENG-Premier League", seasons=season)

          for stat_type, file_prefix in stat_types.items():
              try:
                  print(f"Fetching {stat_type}...")
                  df = fbref.read_player_season_stats(stat_type=stat_type)
                  # Flatten MultiIndex columns into clean single-level snake_case strings
                  df = df.reset_index()
                  clean_cols = []
                  for c in df.columns:
                      if isinstance(c, tuple):
                          name = f"{c[0]}_{c[1]}".strip("_").lower().replace(" ", "_")
                      else:
                          name = str(c).strip().lower().replace(" ", "_")
                      clean_cols.append(name)
                  df.columns = clean_cols
                  df["snapshot_date"] = today

                  filename = f"{file_prefix}_{today}.csv"
                  df.to_csv(filename, index=False)
                  print(f"  {stat_type}: {len(df)} rows, {len(df.columns)} cols -> {filename}")
              except Exception as e:
                  print(f"  {stat_type} failed: {e}")
                  empty = pd.DataFrame({"status": ["error"], "error": [str(e)], "snapshot_date": [today]})
                  empty.to_csv(f"{file_prefix}_{today}.csv", index=False)

              time.sleep(DELAY_SECONDS)

      except Exception as e:
          print(f"FBref connection failed entirely: {e}")
          empty = pd.DataFrame({"status": ["connection_error"], "error": [str(e)], "date": [today]})
          for file_prefix in stat_types.values():
              empty.to_csv(f"{file_prefix}_{today}.csv", index=False)

      print("FBref scraping complete.")

  - id: upload_standard
    type: io.kestra.plugin.gcp.gcs.Upload
    from: "{{ outputs.scrape_fbref.outputFiles['fbref_standard_' ~ (now() | date('yyyy-MM-dd')) ~ '.csv'] }}"
    to: "gs://fpl_raw_archive_de-project-allan/fbref/fbref_standard_{{ now() | date('yyyy-MM-dd') }}.csv"
    projectId: de-project-allan

  - id: upload_keeper
    type: io.kestra.plugin.gcp.gcs.Upload
    from: "{{ outputs.scrape_fbref.outputFiles['fbref_keeper_' ~ (now() | date('yyyy-MM-dd')) ~ '.csv'] }}"
    to: "gs://fpl_raw_archive_de-project-allan/fbref/fbref_keeper_{{ now() | date('yyyy-MM-dd') }}.csv"
    projectId: de-project-allan

  - id: upload_shooting
    type: io.kestra.plugin.gcp.gcs.Upload
    from: "{{ outputs.scrape_fbref.outputFiles['fbref_shooting_' ~ (now() | date('yyyy-MM-dd')) ~ '.csv'] }}"
    to: "gs://fpl_raw_archive_de-project-allan/fbref/fbref_shooting_{{ now() | date('yyyy-MM-dd') }}.csv"
    projectId: de-project-allan

  - id: upload_misc
    type: io.kestra.plugin.gcp.gcs.Upload
    from: "{{ outputs.scrape_fbref.outputFiles['fbref_misc_' ~ (now() | date('yyyy-MM-dd')) ~ '.csv'] }}"
    to: "gs://fpl_raw_archive_de-project-allan/fbref/fbref_misc_{{ now() | date('yyyy-MM-dd') }}.csv"
    projectId: de-project-allan

triggers:
  - id: weekly_tuesday
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 10 * * 2"
