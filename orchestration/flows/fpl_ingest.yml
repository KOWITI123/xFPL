id: fpl_ingest
namespace: xfpl

description: |
  Weekly FPL data extraction pipeline.
  Fetches player data, fixtures, and live stats for every started gameweek
  from the FPL API and uploads to GCS (re-pulling all weeks backfills any missed run).

inputs:
  - id: season
    type: STRING
    defaults: "2026-27"

tasks:
  # ── 1. Bootstrap-static: players, teams, gameweeks ──
  - id: fetch_bootstrap
    type: io.kestra.plugin.core.http.Download
    uri: https://fantasy.premierleague.com/api/bootstrap-static/
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

  - id: upload_bootstrap
    type: io.kestra.plugin.gcp.gcs.Upload
    from: "{{ outputs.fetch_bootstrap.uri }}"
    to: "gs://fpl_raw_archive_de-project-allan/fpl/snapshots/fpl_snapshot_{{ now() | date('yyyy-MM-dd') }}.json"
    projectId: de-project-allan

  # ── 2. Fixtures: all matches and scores ──
  - id: fetch_fixtures
    type: io.kestra.plugin.core.http.Download
    uri: https://fantasy.premierleague.com/api/fixtures/
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

  - id: upload_fixtures
    type: io.kestra.plugin.gcp.gcs.Upload
    from: "{{ outputs.fetch_fixtures.uri }}"
    to: "gs://fpl_raw_archive_de-project-allan/fpl/fixtures/fpl_fixtures_{{ now() | date('yyyy-MM-dd') }}.json"
    projectId: de-project-allan

  # ── 3. Gameweek live stats: every started gameweek, every run ──
  # Fetching only the "current" gameweek lost any week the flow didn't run during
  # (GW2 and GW4 were never captured). Re-pulling all started gameweeks makes each
  # run self-healing; stg_fpl_live keeps the newest snapshot per player/gameweek,
  # so re-fetched weeks also pick up late bonus/stat corrections.
  - id: fetch_gameweek_live
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    outputFiles:
      - "*.json"
    script: |
      import json
      import time
      import requests

      headers = {
          "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
      }

      resp = requests.get("https://fantasy.premierleague.com/api/bootstrap-static/", headers=headers, timeout=30)
      resp.raise_for_status()
      events = resp.json()["events"]

      # Finished gameweeks plus the in-progress one (deadline passed)
      gameweeks = [e["id"] for e in events if e["finished"] or e["is_current"]]

      if not gameweeks:
          print("No started gameweek found — season may not have started yet")
          with open("gw_0_not_started.json", "w") as f:
              json.dump({"status": "season_not_started"}, f)

      for gw in gameweeks:
          live_resp = requests.get(f"https://fantasy.premierleague.com/api/event/{gw}/live/", headers=headers, timeout=30)
          live_resp.raise_for_status()
          live_data = live_resp.json()
          live_data["_gameweek"] = gw
          with open(f"gw_{gw}_live.json", "w") as f:
              json.dump(live_data, f)
          print(f"Fetched live data for GW {gw} ({len(live_data['elements'])} players)")
          time.sleep(1)  # be polite to the FPL API

  - id: upload_gameweek_live
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ outputs.fetch_gameweek_live.outputFiles | keys }}"
    tasks:
      - id: upload_gameweek_file
        type: io.kestra.plugin.gcp.gcs.Upload
        from: "{{ outputs.fetch_gameweek_live.outputFiles[taskrun.value] }}"
        to: "gs://fpl_raw_archive_de-project-allan/fpl/gameweeks/{{ taskrun.value }}_{{ now() | date('yyyy-MM-dd') }}.json"
        projectId: de-project-allan

triggers:
  - id: weekly_tuesday
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 2"
